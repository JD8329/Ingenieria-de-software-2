      .label { fill: #18231b; font: bold 16px Arial, sans-serif; }
      .small { fill: #36453a; font: 13px Arial, sans-serif; }
      .edge { fill: none; stroke: #245b36; stroke-width: 2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #245b36; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="node" x="395" y="25" width="330" height="55" rx="10"/>
