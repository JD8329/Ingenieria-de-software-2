name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'taller/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar estilo con Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check

      - name: Ejecutar pruebas JUnit
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Verificar cobertura con JaCoCo
        run: ./mvnw --batch-mode --no-transfer-progress jacoco:check@check-coverage
