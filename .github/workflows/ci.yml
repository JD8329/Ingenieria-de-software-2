name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'taller/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar estilo con Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check

      - name: Ejecutar pruebas JUnit
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Verificar cobertura con JaCoCo
        run: ./mvnw --batch-mode --no-transfer-progress jacoco:check@check-coverage

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    steps:
      - name: Disparar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta configurar el secreto RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" --output /dev/null
          echo "Render aceptó la solicitud de despliegue de staging."
