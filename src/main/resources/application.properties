spring.application.name=agrovalle-connect
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:agrovalle_connect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=agrovalle-connect
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@agrovalle.local}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/restablecer-password}
