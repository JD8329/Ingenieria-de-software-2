spring.application.name=agrovalle-connect-test
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.security.jwt.secret=sprint-1-test-secret-at-least-32-bytes-long
app.security.jwt.issuer=agrovalle-connect
spring.mail.host=localhost
spring.mail.port=1025
app.password-reset.base-url=http://localhost:3000/restablecer-password
app.password-reset.sender=no-reply@agrovalleconnect.test
