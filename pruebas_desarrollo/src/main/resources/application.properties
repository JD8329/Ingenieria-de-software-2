spring.application.name=agrovalle-connect
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:agrovalle_connect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=agrovalle-connect
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:3000/restablecer-password}
app.password-reset.sender=${PASSWORD_RESET_SENDER:no-reply@agrovalleconnect.local}
